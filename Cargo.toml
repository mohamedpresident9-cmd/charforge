[package]
name = "charforge"
version = "0.1.2"
edition = "2021"
description = "Character studio: concurrent asset transport, local library, and studio UI"

[dependencies]
eframe = "0.29"
sha2 = "0.10"

[profile.dev.package."*"]
# Dependencies (egui, winit, ...) are painfully slow in pure debug; optimize them only.
opt-level = 2

[profile.release]
# Keeps the shipped Linux binary around 5 MB instead of 16 MB.
strip = true
